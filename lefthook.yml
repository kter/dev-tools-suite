pre-commit:
  commands:
    format-check:
      glob: "*.ts"
      run: |
        BIOME_FILES=$(echo {staged_files} | tr ' ' '\n' | grep -E \
          '^(tests/|tools/[^/]+/utils/|tools/shared/|vitest\.config\.ts$|playwright\.config\.ts$)' \
          | tr '\n' ' ')
        if [ -n "$BIOME_FILES" ]; then
          bun run biome format $BIOME_FILES
        fi
      fail_text: "Biome format check failed. Run: bun run format"
    lint-staged:
      glob: "*.ts"
      run: |
        BIOME_FILES=$(echo {staged_files} | tr ' ' '\n' | grep -E \
          '^(tests/|tools/[^/]+/utils/|tools/shared/|vitest\.config\.ts$|playwright\.config\.ts$)' \
          | tr '\n' ' ')
        if [ -n "$BIOME_FILES" ]; then
          bun run biome lint --diagnostic-level=error $BIOME_FILES && bun run oxlint $BIOME_FILES
        fi
      fail_text: "Lint errors found. Run: bun run lint"
    unit-tests:
      run: bun run test:unit

pre-push:
  commands:
    unit-tests:
      run: bun run test:unit:coverage
    e2e-dev:
      run: |
        BRANCH=$(git rev-parse --abbrev-ref HEAD)
        if [ "$BRANCH" = "develop" ]; then
          TARGET=dev bun run playwright test --project=dev
        fi
